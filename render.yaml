services:
  - type: web
    name: checkers-with-a-knight-server
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server:start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGINS
        # capacitor://localhost and https://localhost are the iOS and Android app shells.
        value: https://knight-checkers.vercel.app,capacitor://localhost,https://localhost
